<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SehatVerse — Har Umar. Har Level. Better Health.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1A2B;
    --surface:#152A44;
    --surface-2:#1C3557;
    --line: rgba(255,255,255,0.08);
    --cream:#F4EFE3;
    --muted:#9FB0C9;
    --marigold:#FFB238;
    --marigold-2:#FF8A3D;
    --teal:#2DD9BE;
    --coral:#FF6B7A;
    --violet:#9B8CFF;
    --radius:22px;
    --shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(255,178,56,0.14), transparent 60%),
      radial-gradient(1000px 700px at 100% 0%, rgba(45,217,190,0.12), transparent 55%),
      var(--ink);
    color: var(--cream);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{ font-family:'Baloo 2', sans-serif; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background: var(--marigold); color:#1a1200; }
  a{color:inherit;}

  #app{ max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; position:relative; }

  /* ---------- Top bar (shown once past landing) ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 22px; gap:12px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Baloo 2'; font-weight:800; font-size:20px; letter-spacing:0.3px;}
  .brand .globe{ font-size:24px; filter: drop-shadow(0 0 10px rgba(255,178,56,0.5)); }
  .stat-pills{ display:flex; gap:10px; flex-wrap:wrap; }
  .pill{
    display:flex; align-items:center; gap:6px;
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border:1px solid var(--line);
    padding:7px 13px; border-radius:999px; font-size:13px; font-weight:700;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }
  /* ---------- Generic screen container ---------- */
  .screen{ animation: rise .5s ease both; }
  @keyframes rise{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ .screen{animation:none;} }

  .center-col{ display:flex; flex-direction:column; align-items:center; text-align:center; }

  /* ---------- Landing ---------- */
  .landing-hero{ padding: 60px 0 30px; text-align:center; position:relative;}
  .orb{
    position:absolute; border-radius:50%; filter: blur(50px); opacity:0.55; z-index:0;
  }
  .orb.o1{ width:340px; height:340px; background:var(--marigold); top:-80px; left:-60px;}
  .orb.o2{ width:300px; height:300px; background:var(--teal); top:40px; right:-80px;}
  .landing-hero > *{ position:relative; z-index:1; }
  .kicker{
    display:inline-flex; align-items:center; gap:8px;
    background: rgba(255,178,56,0.12); border:1px solid rgba(255,178,56,0.35);
    color: var(--marigold); font-weight:700; font-size:13px;
    padding:6px 14px; border-radius:999px; margin-bottom:22px;
  }
  .hero-title{ font-size: clamp(38px, 7vw, 76px); font-weight:800; line-height:1.02; margin:0 0 6px;
    background: linear-gradient(180deg, #fff, #FFD9A0 70%);
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hero-tagline{ font-size: clamp(16px,2.4vw,22px); color:var(--marigold); font-weight:700; margin: 6px 0 4px;}
  .hero-sub{ font-size: clamp(14px,2vw,17px); color:var(--muted); margin: 10px auto 34px; max-width:560px; }
  .cta-row{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .btn{
    border:none; border-radius:16px; padding:15px 28px; font-weight:800; font-size:15.5px;
    transition: transform .15s ease, box-shadow .15s ease; letter-spacing:.2px;
  }
  .btn:hover{ transform: translateY(-2px); }
  .btn:focus-visible{ outline: 3px solid var(--teal); outline-offset:3px; }
  .btn-primary{ background: linear-gradient(135deg, var(--marigold), var(--marigold-2)); color:#20130A;
    box-shadow: 0 14px 30px rgba(255,138,61,0.35); }
  .btn-ghost{ background: rgba(255,255,255,0.06); color:var(--cream); border:1px solid var(--line); }
  .btn-ghost:hover{ background: rgba(255,255,255,0.1); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:9px 16px; font-size:13.5px; border-radius:12px; }

  .feature-grid{ display:grid; grid-template-columns: repeat(4,1fr); gap:16px; margin-top:56px; }
  @media(max-width:800px){ .feature-grid{grid-template-columns:repeat(2,1fr);} }
  .fcard{ background: linear-gradient(180deg, var(--surface-2), var(--surface)); border:1px solid var(--line);
    border-radius: var(--radius); padding:20px; text-align:left; }
  .fcard .ic{ font-size:26px; }
  .fcard h3{ margin:10px 0 4px; font-size:16px; }
  .fcard p{ margin:0; color:var(--muted); font-size:13.5px; line-height:1.5;}

  /* ---------- Section heading pattern ---------- */
  .step-eyebrow{ color:var(--marigold); font-weight:800; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:8px;}
  .step-title{ font-size: clamp(26px,4vw,36px); margin:0 0 8px; }
  .step-sub{ color:var(--muted); font-size:15px; margin-bottom:34px; max-width:520px; }
 
  /* ---------- Age selector ---------- */
  .age-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; width:100%; }
  .age-card{
    position:relative; border-radius:20px; padding:22px 18px; text-align:left; border:1px solid var(--line);
    background: var(--age-grad); overflow:hidden; transition: transform .18s ease, box-shadow .18s ease;
  }
  .age-card:hover{ transform: translateY(-4px); box-shadow: var(--shadow); }
  .age-card .range{ font-size:12.5px; font-weight:800; opacity:.85; }
  .age-card .name{ font-family:'Baloo 2'; font-size:21px; font-weight:800; margin:4px 0 6px; }
  .age-card .desc{ font-size:12.5px; opacity:.85; line-height:1.5; }
  .age-card .emo{ position:absolute; right:12px; top:10px; font-size:34px; opacity:.9; }

  /* ---------- Theme/avatar chooser ---------- */
  .theme-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; width:100%; }
  .theme-card{ border-radius:18px; padding:20px 14px; border:1px solid var(--line); background: var(--surface);
    text-align:center; transition:.15s; }
  .theme-card:hover{ transform: translateY(-3px); border-color: var(--marigold); }
  .theme-card.picked{ outline:2px solid var(--marigold); background: var(--surface-2); }
  .theme-card .sw{ width:36px; height:36px; border-radius:50%; margin:0 auto 10px; }
  .theme-card .lbl{ font-weight:700; font-size:14px; }

  .avatar-panel{ display:flex; gap:34px; flex-wrap:wrap; justify-content:center; width:100%; }
  .picker-group{ text-align:left; }
  .picker-group h4{ margin:0 0 10px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}
  .emo-grid{ display:grid; grid-template-columns:repeat(4,56px); gap:10px; }
  .emo-btn{ width:56px; height:56px; border-radius:16px; background:var(--surface); border:1px solid var(--line);
    font-size:26px; display:flex; align-items:center; justify-content:center; transition:.15s; }
  .emo-btn:hover{ border-color:var(--marigold); transform:scale(1.06); }
  .emo-btn.picked{ background: linear-gradient(135deg, var(--marigold), var(--marigold-2)); border-color:transparent; }
  .avatar-preview{ width:120px; height:120px; border-radius:32px; display:flex; align-items:center; justify-content:center;
    font-size:52px; background: linear-gradient(160deg, var(--surface-2), var(--surface)); border:1px solid var(--line);
    box-shadow: var(--shadow); position:relative;}
  .avatar-preview .comp{ position:absolute; bottom:-10px; right:-10px; font-size:30px; background:var(--ink);
    border-radius:50%; padding:4px; border:2px solid var(--marigold);}

  /* ---------- Home / dashboard ---------- */
  .home-grid{ display:grid; grid-template-columns: 1.15fr 0.85fr; gap:20px; }
  @media(max-width:900px){ .home-grid{grid-template-columns:1fr;} }
  .panel{ background: linear-gradient(180deg, var(--surface-2), var(--surface)); border:1px solid var(--line);
    border-radius: var(--radius); padding:22px; }
  .panel h3{ margin:0 0 14px; font-size:16px; display:flex; align-items:center; gap:8px;}
  .xp-bar-track{ background: rgba(255,255,255,0.08); border-radius:999px; height:12px; overflow:hidden; }
  .xp-bar-fill{ height:100%; border-radius:999px; background: linear-gradient(90deg, var(--marigold), var(--teal));
    transition: width .5s ease; }

  .mission-item{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .mission-item:last-child{ border-bottom:none; }
  .mission-check{ width:26px; height:26px; border-radius:8px; border:2px solid var(--muted); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:14px; transition:.15s; }
  .mission-check.done{ background: var(--teal); border-color:var(--teal); color:#052; }
  .mission-text{ flex:1; font-size:14px; }
  .mission-text small{ display:block; color:var(--muted); font-weight:500; margin-top:2px;}
  .xp-tag{ font-size:11.5px; font-weight:800; color:var(--marigold); }

  /* ---------- City map ---------- */
  .city-wrap{ position:relative; border-radius: var(--radius); border:1px solid var(--line); padding:26px;
    background:
      radial-gradient(600px 300px at 50% 0%, rgba(155,140,255,0.14), transparent 60%),
      linear-gradient(180deg, var(--surface-2), var(--surface)); }
  .avatar-hub{ display:flex; align-items:center; gap:14px; justify-content:center; margin-bottom:22px; }
  .avatar-hub .av{ width:64px; height:64px; border-radius:20px; background: linear-gradient(160deg, var(--marigold), var(--marigold-2));
    display:flex; align-items:center; justify-content:center; font-size:32px; box-shadow: 0 10px 24px rgba(255,138,61,0.4); }
  .zone-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; }
  .zone-card{ border-radius:18px; padding:16px 14px; border:1px solid var(--line); background: var(--surface);
    text-align:left; position:relative; transition:.15s; min-height:118px; display:flex; flex-direction:column; justify-content:space-between;}
  .zone-card:not(.locked):hover{ transform: translateY(-3px); border-color: var(--teal); }
  .zone-card .zic{ font-size:26px; }
  .zone-card .zname{ font-weight:700; font-size:13.5px; margin-top:8px; line-height:1.3;}
  .zone-card .zprog{ font-size:11px; color:var(--muted); margin-top:6px;}
  .zone-card.locked{ opacity:0.55; }
  .zone-card.locked .lockbadge{ position:absolute; top:10px; right:10px; font-size:14px; }
  .zone-card.playable::after{ content:"PLAY"; position:absolute; top:12px; right:12px; font-size:9.5px; font-weight:800;
    color: var(--ink); background: var(--teal); padding:3px 7px; border-radius:6px; letter-spacing:.5px; }

/* ---------- Quiz ---------- */
  .quiz-card{ background: linear-gradient(180deg, var(--surface-2), var(--surface)); border:1px solid var(--line);
    border-radius: var(--radius); padding:28px; max-width:640px; margin:0 auto; }
  .quiz-meta{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; font-size:12.5px; color:var(--muted); font-weight:700;}
  .quiz-q{ font-size:19px; font-weight:700; margin-bottom:22px; line-height:1.4; }
  .opt-list{ display:flex; flex-direction:column; gap:10px; }
  .opt-btn{ text-align:left; padding:14px 16px; border-radius:14px; border:1px solid var(--line); background: var(--surface);
    font-size:14.5px; font-weight:600; transition:.15s; color:var(--cream); }
  .opt-btn:hover{ border-color: var(--marigold); }
  .opt-btn.correct{ background: rgba(45,217,190,0.18); border-color: var(--teal); }
  .opt-btn.wrong{ background: rgba(255,107,122,0.18); border-color: var(--coral); }
  .opt-btn:disabled{ cursor:default; }
  .feedback-box{ margin-top:18px; padding:16px; border-radius:14px; background: rgba(255,255,255,0.05); font-size:13.5px; color:var(--muted); line-height:1.5; }

  /* ---------- Myth buster ---------- */
  .myth-card{ max-width:560px; margin:0 auto; background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border:1px solid var(--line); border-radius: var(--radius); padding:30px; text-align:center; }
  .myth-crystal{ font-size:50px; margin-bottom:10px; }
  .myth-text{ font-size:18px; font-weight:700; margin:14px 0 24px; line-height:1.4; }
  .myth-choices{ display:flex; gap:14px; justify-content:center; }
  .myth-btn{ flex:1; max-width:150px; padding:16px; border-radius:14px; border:none; font-weight:800; font-size:15px;}
  .myth-fact{ background: linear-gradient(135deg, var(--teal), #17b39c); color:#04241f; }
  .myth-myth{ background: linear-gradient(135deg, var(--coral), #e0505f); color:#2b0409; }

  /* ---------- Trophy room ---------- */
  .badge-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:14px; }
  .badge-card{ text-align:center; padding:18px 10px; border-radius:16px; border:1px solid var(--line); background: var(--surface); }
  .badge-card .bic{ font-size:32px; }
  .badge-card .bname{ font-size:12px; font-weight:700; margin-top:8px; }
  .badge-card.locked{ opacity:.3; }

  /* ---------- Gratitude jar ---------- */
  .jar-wrap{ display:flex; flex-direction:column; align-items:center; gap:18px; }
  .jar{ width:150px; height:190px; border-radius: 20px 20px 44px 44px; border:3px solid rgba(255,255,255,0.25);
    position:relative; overflow:hidden; background: rgba(255,255,255,0.03); }
  .jar-fill{ position:absolute; bottom:0; left:0; right:0; background: linear-gradient(180deg, var(--teal), #1a8f7c);
    transition: height .6s ease; display:flex; flex-wrap:wrap; align-content:flex-end; justify-content:center; gap:2px; padding:4px; font-size:14px; }
  .jar-input{ display:flex; gap:8px; width:100%; max-width:420px; }
  .jar-input input{ flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background: var(--surface);
    color:var(--cream); font-family:inherit; font-size:14px; }
  .entry-list{ width:100%; max-width:420px; text-align:left; display:flex; flex-direction:column; gap:8px; max-height:160px; overflow:auto; }
  .entry-item{ background: var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-size:13px; }

  /* ---------- Toast ---------- */
  #toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background: linear-gradient(135deg, var(--marigold), var(--marigold-2)); color:#20130A; font-weight:800; font-size:14px;
    padding:14px 24px; border-radius:14px; box-shadow: var(--shadow); z-index:50; transition: all .3s ease; pointer-events:none; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .back-link{ background:none; border:none; color:var(--muted); font-weight:700; font-size:13.5px; margin-bottom:18px;
    display:flex; align-items:center; gap:6px; padding:0; }
  .back-link:hover{ color:var(--cream); }

  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
  .visually-hidden-focusable:focus{ position:static; width:auto; height:auto; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* =========================================================
   SEHATVERSE — CORE DEMO
   Front-end only reference implementation of the priority-1/2
   product loop. State lives in memory (no localStorage per
   artifact rules) — a real deployment persists this via the
   Supabase schema in /supabase/schema.sql.
   ========================================================= */

/* ---------------- CONFIG / CONTENT ---------------- */

const AGE_GROUPS = [
  {id:'k', range:'3–12', name:'Sehat Superstars', emo:'🦄', grad:'linear-gradient(160deg,#FF9AD5,#7BD5FF)',
   desc:'Magical adventure world with friendly animal guides.'},
  {id:'teen', range:'12–16', name:'Sehat Squad', emo:'⚡', grad:'linear-gradient(160deg,#FFD23F,#FF6B6B)',
   desc:'Action-hero missions and battle-style challenges.'},
  {id:'lab', range:'16–18', name:'Health Lab', emo:'🧬', grad:'linear-gradient(160deg,#7B61FF,#33D6C4)',
   desc:'Holographic science lab with real experiments.'},
  {id:'guard', range:'18–23', name:'Sehat Guardians', emo:'🚀', grad:'linear-gradient(160deg,#3355FF,#33D6C4)',
   desc:'Futuristic city, modern lifestyle missions.'},
  {id:'pro', range:'23–30', name:'Wellness Pro', emo:'💼', grad:'linear-gradient(160deg,#FFB238,#FF6B6B)',
   desc:'Work-life balance, fitness and nutrition focus.'},
  {id:'bal', range:'30–40', name:'Sehat Balance', emo:'🌿', grad:'linear-gradient(160deg,#3AA76D,#B7E778)',
   desc:'Family, nature and everyday balance.'},
  {id:'mast', range:'40–50', name:'Sehat Masters', emo:'🏆', grad:'linear-gradient(160deg,#D4AF37,#8C6A2F)',
   desc:'Elegant, prevention-focused wellness mastery.'},
];

const STYLES = [
  {id:'feminine', label:'Feminine', emo:'🌸', color:'#FF9AD5'},
  {id:'action', label:'Action', emo:'⚡', color:'#FF6B6B'},
  {id:'neutral', label:'Neutral', emo:'🌈', color:'#9B8CFF'},
  {id:'calm', label:'Calm', emo:'🌿', color:'#2DD9BE'},
  {id:'custom', label:'Custom', emo:'🎨', color:'#FFB238'},
  {id:'na', label:'Prefer not to say', emo:'⚪', color:'#9FB0C9'},
];

const AVATAR_OPTIONS = ['🧑','👧','👦','🧕','👨','👩','🧑‍🦱','🧑‍🦳'];
const COMPANION_OPTIONS = [
  {id:'unicorn', emo:'🦄'}, {id:'panda', emo:'🐼'}, {id:'fox', emo:'🦊'},
  {id:'bunny', emo:'🐰'}, {id:'lion', emo:'🦁'}, {id:'tiger', emo:'🐯'}, {id:'koala', emo:'🐨'},
];

// All 13 zones for the full city; only a few are wired to real gameplay in this demo.
const ZONES = [
  {id:'hygiene', name:'Hygiene Haven', icon:'🧼', reqLevel:1, playable:true},
  {id:'nutrition', name:'Poshan Park', icon:'🥗', reqLevel:1, playable:true},
  {id:'myth', name:'Myth Buster Tower', icon:'🧠', reqLevel:1, playable:true},
  {id:'hydration', name:'Hydration Hub', icon:'💧', reqLevel:1, playable:false},
  {id:'disease', name:'Disease Defense HQ', icon:'🦠', reqLevel:2, playable:false},
  {id:'emergency', name:'Emergency HQ', icon:'🚑', reqLevel:2, playable:false},
  {id:'wellness', name:'Wellness Garden', icon:'🧠', reqLevel:2, playable:false},
  {id:'vision', name:'Nazar Nagar', icon:'👁️', reqLevel:3, playable:false},
  {id:'dental', name:'Smile Street', icon:'🦷', reqLevel:3, playable:false},
  {id:'fitness', name:'Fitness Arena', icon:'🏃', reqLevel:3, playable:false},
  {id:'sleep', name:'Sleep Sanctuary', icon:'😴', reqLevel:3, playable:false},
  {id:'heart', name:'Heart Harbor', icon:'❤️', reqLevel:4, playable:false},
  {id:'gratitude', name:'Gratitude Garden', icon:'🫙', reqLevel:1, playable:true},
];

// Two levels each, foundation + challenge — mirrors the spec's minimum-2-levels rule.
const QUIZ_BANK = {
  hygiene: {
    1: [
      {q:'When should you wash your hands with soap?', opts:['Before eating food','Only after using the toilet','Once a day is enough','Only when hands look dirty'], correct:0,
       exp:'Handwashing before eating removes germs picked up from surfaces, cutting the risk of infection.'},
      {q:'How long should proper handwashing take?', opts:['2 seconds','About 20 seconds','5 minutes','It doesn\'t matter'], correct:1,
       exp:'About 20 seconds — roughly the time it takes to hum a short tune twice — is enough to remove most germs.'},
      {q:'Which of these is a hygiene mistake?', opts:['Covering a cough with your elbow','Sharing a towel with everyone at home','Washing fruit before eating','Brushing teeth twice a day'], correct:1,
       exp:'Shared towels can pass germs between people — everyone doing their own reduces that risk.'},
    ],
    2: [
      {q:'You\'re in a hostel kitchen and see raw chicken touching a salad on the same board. What\'s the risk?', opts:['No risk, both are food','Cross-contamination can spread bacteria','Only a problem if it smells bad','Cooking will fix it either way'], correct:1,
       exp:'Raw meat can carry bacteria that transfer to ready-to-eat food like salad — separate boards prevent this.'},
      {q:'Best habit to prevent spreading infection at a workplace?', opts:['Coming to work sick to not lose pay','Staying home when contagious and washing hands often','Wearing perfume instead of washing hands','Ignoring it — it will pass'], correct:1,
       exp:'Staying home when contagious, plus regular handwashing, are two of the most effective ways to limit spread.'},
    ],
  },
  nutrition: {
    1: [
      {q:'A balanced plate should mostly include:', opts:['Only fried snacks','A mix of vegetables, grains, and protein','Only sugary drinks','Just one food group'], correct:1,
       exp:'A balanced plate combines food groups — vegetables, whole grains, and protein — for steady energy and nutrients.'},
      {q:'Which is a good source of protein?', opts:['Candy','Lentils (dal)','Soda','Chips'], correct:1,
       exp:'Lentils are a strong plant-based protein source, common in everyday meals.'},
      {q:'Reading a food label helps you check:', opts:['The color of the packet','Sugar, fat, and nutrient content','The brand\'s logo design','Nothing useful'], correct:1,
       exp:'Food labels show nutrient content like sugar and fat, helping you make an informed choice.'},
    ],
    2: [
      {q:'Your canteen only offers fried snacks and soda. What\'s the healthier move?', opts:['Skip the meal entirely','Add fruit or nuts from home to balance it','Eat double the fried snacks','Drink two sodas instead of one'], correct:1,

function xpForLevel(lvl){ return lvl * 150; }

function addXP(n){
  state.xp += n;
  while(state.xp >= xpForLevel(state.level)){
    state.xp -= xpForLevel(state.level);
    state.level += 1;
    toast(`🎉 Level up! You're now Level ${state.level}`);
  }
}

function awardBadge(id){
  if(!state.badges.includes(id)){
    state.badges.push(id);
    const b = BADGES.find(x=>x.id===id);
    if(b) toast(`🏅 Badge earned: ${b.name}`);
  }
}

function markDaily(zoneId){
  const task = state.dailyTasks.find(t=>t.zone===zoneId && !t.done);
  if(task){
    task.done = true;
    addXP(task.xp);
    if(state.dailyTasks.every(t=>t.done)){
      state.streak += 1;
      toast(`🔥 All missions done! Streak is now ${state.streak} days`);
    }
  }
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2600);
}

function go(screen, extra){
  state.screen = screen;
  Object.assign(state, extra||{});
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------------- MAIN RENDER ---------------- */

function render(){
  const app = document.getElementById('app');
  let body = '';
  switch(state.screen){
    case 'landing': body = screenLanding(); break;
    case 'age': body = screenAge(); break;
    case 'style': body = screenStyle(); break;
    case 'avatar': body = screenAvatar(); break;
    case 'home': body = screenHome(); break;
    case 'zoneIntro': body = screenZoneIntro(state.activeZone); break;
    case 'quiz': body = screenQuiz(); break;
    case 'quizResult': body = screenQuizResult(); break;
    default: body = screenLanding();
  }
  app.innerHTML = topbar() + body;
  wireEvents();
}
