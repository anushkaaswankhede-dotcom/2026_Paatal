<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SehatVerse — Har Umar. Har Level. Better Health.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1A2B;
    --surface:#152A44;
    --surface-2:#1C3557;
    --line: rgba(255,255,255,0.08);
    --cream:#F4EFE3;
    --muted:#9FB0C9;
    --marigold:#FFB238;
    --marigold-2:#FF8A3D;
    --teal:#2DD9BE;
    --coral:#FF6B7A;
    --violet:#9B8CFF;
    --radius:22px;
    --shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(255,178,56,0.14), transparent 60%),
      radial-gradient(1000px 700px at 100% 0%, rgba(45,217,190,0.12), transparent 55%),
      var(--ink);
    color: var(--cream);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{ font-family:'Baloo 2', sans-serif; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background: var(--marigold); color:#1a1200; }
  a{color:inherit;}

  #app{ max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; position:relative; }

  /* ---------- Top bar (shown once past landing) ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 22px; gap:12px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Baloo 2'; font-weight:800; font-size:20px; letter-spacing:0.3px;}
  .brand .globe{ font-size:24px; filter: drop-shadow(0 0 10px rgba(255,178,56,0.5)); }
  .stat-pills{ display:flex; gap:10px; flex-wrap:wrap; }
  .pill{
    display:flex; align-items:center; gap:6px;
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border:1px solid var(--line);
    padding:7px 13px; border-radius:999px; font-size:13px; font-weight:700;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }
  /* ---------- Generic screen container ---------- */
  .screen{ animation: rise .5s ease both; }
  @keyframes rise{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ .screen{animation:none;} }

  .center-col{ display:flex; flex-direction:column; align-items:center; text-align:center; }

  /* ---------- Landing ---------- */
  .landing-hero{ padding: 60px 0 30px; text-align:center; position:relative;}
  .orb{
    position:absolute; border-radius:50%; filter: blur(50px); opacity:0.55; z-index:0;
  }
  .orb.o1{ width:340px; height:340px; background:var(--marigold); top:-80px; left:-60px;}
  .orb.o2{ width:300px; height:300px; background:var(--teal); top:40px; right:-80px;}
  .landing-hero > *{ position:relative; z-index:1; }
  .kicker{
    display:inline-flex; align-items:center; gap:8px;
    background: rgba(255,178,56,0.12); border:1px solid rgba(255,178,56,0.35);
    color: var(--marigold); font-weight:700; font-size:13px;
    padding:6px 14px; border-radius:999px; margin-bottom:22px;
  }
  .hero-title{ font-size: clamp(38px, 7vw, 76px); font-weight:800; line-height:1.02; margin:0 0 6px;
    background: linear-gradient(180deg, #fff, #FFD9A0 70%);
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hero-tagline{ font-size: clamp(16px,2.4vw,22px); color:var(--marigold); font-weight:700; margin: 6px 0 4px;}
  .hero-sub{ font-size: clamp(14px,2vw,17px); color:var(--muted); margin: 10px auto 34px; max-width:560px; }
  .cta-row{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .btn{
    border:none; border-radius:16px; padding:15px 28px; font-weight:800; font-size:15.5px;
    transition: transform .15s ease, box-shadow .15s ease; letter-spacing:.2px;
  }
  .btn:hover{ transform: translateY(-2px); }
  .btn:focus-visible{ outline: 3px solid var(--teal); outline-offset:3px; }
  .btn-primary{ background: linear-gradient(135deg, var(--marigold), var(--marigold-2)); color:#20130A;
    box-shadow: 0 14px 30px rgba(255,138,61,0.35); }
  .btn-ghost{ background: rgba(255,255,255,0.06); color:var(--cream); border:1px solid var(--line); }
  .btn-ghost:hover{ background: rgba(255,255,255,0.1); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:9px 16px; font-size:13.5px; border-radius:12px; }

  .feature-grid{ display:grid; grid-template-columns: repeat(4,1fr); gap:16px; margin-top:56px; }
  @media(max-width:800px){ .feature-grid{grid-template-columns:repeat(2,1fr);} }
  .fcard{ background: linear-gradient(180deg, var(--surface-2), var(--surface)); border:1px solid var(--line);
    border-radius: var(--radius); padding:20px; text-align:left; }
  .fcard .ic{ font-size:26px; }
  .fcard h3{ margin:10px 0 4px; font-size:16px; }
  .fcard p{ margin:0; color:var(--muted); font-size:13.5px; line-height:1.5;}

  /* ---------- Section heading pattern ---------- */
  .step-eyebrow{ color:var(--marigold); font-weight:800; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:8px;}
  .step-title{ font-size: clamp(26px,4vw,36px); margin:0 0 8px; }
  .step-sub{ color:var(--muted); font-size:15px; margin-bottom:34px; max-width:520px; }
 
  /* ---------- Age selector ---------- */
  .age-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; width:100%; }
  .age-card{
    position:relative; border-radius:20px; padding:22px 18px; text-align:left; border:1px solid var(--line);
    background: var(--age-grad); overflow:hidden; transition: transform .18s ease, box-shadow .18s ease;
  }
  .age-card:hover{ transform: translateY(-4px); box-shadow: var(--shadow); }
  .age-card .range{ font-size:12.5px; font-weight:800; opacity:.85; }
  .age-card .name{ font-family:'Baloo 2'; font-size:21px; font-weight:800; margin:4px 0 6px; }
  .age-card .desc{ font-size:12.5px; opacity:.85; line-height:1.5; }
  .age-card .emo{ position:absolute; right:12px; top:10px; font-size:34px; opacity:.9; }

  /* ---------- Theme/avatar chooser ---------- */
  .theme-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; width:100%; }
  .theme-card{ border-radius:18px; padding:20px 14px; border:1px solid var(--line); background: var(--surface);
    text-align:center; transition:.15s; }
  .theme-card:hover{ transform: translateY(-3px); border-color: var(--marigold); }
  .theme-card.picked{ outline:2px solid var(--marigold); background: var(--surface-2); }
  .theme-card .sw{ width:36px; height:36px; border-radius:50%; margin:0 auto 10px; }
  .theme-card .lbl{ font-weight:700; font-size:14px; }

  .avatar-panel{ display:flex; gap:34px; flex-wrap:wrap; justify-content:center; width:100%; }
  .picker-group{ text-align:left; }
  .picker-group h4{ margin:0 0 10px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}
  .emo-grid{ display:grid; grid-template-columns:repeat(4,56px); gap:10px; }
  .emo-btn{ width:56px; height:56px; border-radius:16px; background:var(--surface); border:1px solid var(--line);
    font-size:26px; display:flex; align-items:center; justify-content:center; transition:.15s; }
  .emo-btn:hover{ border-color:var(--marigold); transform:scale(1.06); }
  .emo-btn.picked{ background: linear-gradient(135deg, var(--marigold), var(--marigold-2)); border-color:transparent; }
  .avatar-preview{ width:120px; height:120px; border-radius:32px; display:flex; align-items:center; justify-content:center;
    font-size:52px; background: linear-gradient(160deg, var(--surface-2), var(--surface)); border:1px solid var(--line);
    box-shadow: var(--shadow); position:relative;}
  .avatar-preview .comp{ position:absolute; bottom:-10px; right:-10px; font-size:30px; background:var(--ink);
    border-radius:50%; padding:4px; border:2px solid var(--marigold);}

  /* ---------- Home / dashboard ---------- */
  .home-grid{ display:grid; grid-template-columns: 1.15fr 0.85fr; gap:20px; }
  @media(max-width:900px){ .home-grid{grid-template-columns:1fr;} }
  .panel{ background: linear-gradient(180deg, var(--surface-2), var(--surface)); border:1px solid var(--line);
    border-radius: var(--radius); padding:22px; }
  .panel h3{ margin:0 0 14px; font-size:16px; display:flex; align-items:center; gap:8px;}
  .xp-bar-track{ background: rgba(255,255,255,0.08); border-radius:999px; height:12px; overflow:hidden; }
  .xp-bar-fill{ height:100%; border-radius:999px; background: linear-gradient(90deg, var(--marigold), var(--teal));
    transition: width .5s ease; }

  .mission-item{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .mission-item:last-child{ border-bottom:none; }
  .mission-check{ width:26px; height:26px; border-radius:8px; border:2px solid var(--muted); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:14px; transition:.15s; }
  .mission-check.done{ background: var(--teal); border-color:var(--teal); color:#052; }
  .mission-text{ flex:1; font-size:14px; }
  .mission-text small{ display:block; color:var(--muted); font-weight:500; margin-top:2px;}
  .xp-tag{ font-size:11.5px; font-weight:800; color:var(--marigold); }

  /* ---------- City map ---------- */
  .city-wrap{ position:relative; border-radius: var(--radius); border:1px solid var(--line); padding:26px;
    background:
      radial-gradient(600px 300px at 50% 0%, rgba(155,140,255,0.14), transparent 60%),
      linear-gradient(180deg, var(--surface-2), var(--surface)); }
  .avatar-hub{ display:flex; align-items:center; gap:14px; justify-content:center; margin-bottom:22px; }
  .avatar-hub .av{ width:64px; height:64px; border-radius:20px; background: linear-gradient(160deg, var(--marigold), var(--marigold-2));
    display:flex; align-items:center; justify-content:center; font-size:32px; box-shadow: 0 10px 24px rgba(255,138,61,0.4); }
  .zone-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; }
  .zone-card{ border-radius:18px; padding:16px 14px; border:1px solid var(--line); background: var(--surface);
    text-align:left; position:relative; transition:.15s; min-height:118px; display:flex; flex-direction:column; justify-content:space-between;}
  .zone-card:not(.locked):hover{ transform: translateY(-3px); border-color: var(--teal); }
  .zone-card .zic{ font-size:26px; }
  .zone-card .zname{ font-weight:700; font-size:13.5px; margin-top:8px; line-height:1.3;}
  .zone-card .zprog{ font-size:11px; color:var(--muted); margin-top:6px;}
  .zone-card.locked{ opacity:0.55; }
  .zone-card.locked .lockbadge{ position:absolute; top:10px; right:10px; font-size:14px; }
  .zone-card.playable::after{ content:"PLAY"; position:absolute; top:12px; right:12px; font-size:9.5px; font-weight:800;
    color: var(--ink); background: var(--teal); padding:3px 7px; border-radius:6px; letter-spacing:.5px; }
